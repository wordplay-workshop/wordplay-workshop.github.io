<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>
    <div class="container">

      {%- include header.html -%}

    <main>
      {{ content }}
    </main>

    {%- include footer.html -%}

    </div>
    
    <!-- Custom CSS for extended ASCII lines -->
    <style>
      /* Custom CSS overrides for Wordplay Workshop */
      
      /* Remove original borders and add full-width ASCII lines */
      .menu {
        border-top: none !important;
        border-bottom: none !important;
        position: relative;
        width: 100%;
        box-sizing: border-box;
      }
      
      .menu::before,
      .menu::after {
        content: "─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────";
        display: block;
        color: rgba(0, 255, 0, 0.9);
        font-family: monospace;
        font-size: 14px;
        line-height: 1;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        
        /* Make lines extend to full viewport width */
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        width: 100vw;
        padding-left: 0;
        padding-right: 0;
        text-indent: 0;
      }

      .menu::before {
        margin-bottom: 12px;
      }

      .menu::after {
        margin-top: 12px;
      }

      /* Ensure it works on mobile */
      @media only screen and (max-device-width: 500px) {
        .menu::before,
        .menu::after {
          font-size: 12px;
        }
      }

      /* Style horizontal rules to match the retro ASCII theme */
      hr {
        border: none !important;
        height: auto !important;
        background: none !important;
        text-align: center;
        margin: 20px 0;
        color: rgba(0, 255, 0, 0.9);
        font-family: monospace;
        font-size: 14px;
        line-height: 1;
      }

      hr::before {
        content: "─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────";
        display: block;
        color: rgba(0, 255, 0, 0.9);
        white-space: nowrap;
        overflow: hidden;
        
        /* Make hr lines extend to full viewport width too */
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        width: 100vw;
      }

      /* Mobile responsive for hr */
      @media only screen and (max-device-width: 500px) {
        hr::before {
          font-size: 12px;
        }
      }
    </style>
  </body>
</html>
